name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Generated API client matches openapi.yaml
        run: |
          pnpm --filter @seatlock/api-client generate
          git diff --exit-code -- packages/api-client/src/schema.d.ts \
            || { echo "::error::Run 'pnpm generate' and commit packages/api-client/src/schema.d.ts"; exit 1; }

      - name: Lint, type-check, unit tests, build
        run: pnpm turbo run lint typecheck test build

      # Real Postgres 16 and Redis 7 via Testcontainers. Applies every migration to a fresh
      # database and validates responses against openapi.yaml (ADR-0014).
      - name: Integration and contract tests
        run: pnpm turbo run test:integration

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API/worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: seatlock-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
