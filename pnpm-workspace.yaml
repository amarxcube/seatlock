packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm blocks them by default).
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma

# Optional native add-ons and telemetry we don't need; skipping is intentional.
ignoredBuiltDependencies:
  - '@scarf/scarf'
  - cpu-features
  - msgpackr-extract
  - protobufjs
  - ssh2
